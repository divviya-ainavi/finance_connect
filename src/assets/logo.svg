<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- Icon: Abstract finance/connection symbol -->
  <g>
    <!-- Overlapping circles representing connection -->
    <circle cx="16" cy="20" r="12" fill="#2563eb" opacity="0.9"/>
    <circle cx="28" cy="20" r="12" fill="#0891b2" opacity="0.9"/>
    <!-- Chart bars in center -->
    <rect x="18" y="14" width="4" height="12" rx="1" fill="white"/>
    <rect x="24" y="18" width="4" height="8" rx="1" fill="white"/>
  </g>
  <!-- Text: Finance Connect -->
  <text x="48" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1e293b">
    <tspan fill="#2563eb">Finance</tspan><tspan fill="#0891b2"> Connect</tspan>
  </text>
</svg>
